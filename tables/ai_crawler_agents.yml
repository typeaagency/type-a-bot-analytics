  - { name: ClaudeBot }
  - { name: CCBot }
  - { name: Bytespider }
  - { name: Meta-ExternalAgent }
  - { name: Amazonbot }
search_index:
  - { name: OAI-SearchBot }
  - { name: Claude-SearchBot }
  - { name: PerplexityBot }
user_fetch:
  - { name: ChatGPT-User }
  - { name: Claude-User }
  - { name: Perplexity-User }
  - { name: MistralAI-User }
  - { name: Meta-ExternalFetcher }
