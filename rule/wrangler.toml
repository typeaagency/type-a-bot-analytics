# The counting rule. Put your site's routes below, then `npm run deploy:rule`.
# Deploy the dashboard first: the service binding below names it.
name = "bot-analytics-rule"
main = "../src/rule.js"
compatibility_date = "2026-11-01"
workers_dev = false

# One route for each host to count. Leave the failure mode at "Fail open" in
# the Cloudflare dashboard, so your site never depends on this Worker.
routes = [
  { pattern = "example.com/*", zone_name = "example.com" },
]

# The rule sends each hit to the dashboard Worker of the same account. A
# fetch to a workers.dev address of the same account fails, so use this
# binding, not the dashboard's URL.
services = [
  { binding = "DASHBOARD", service = "bot-analytics-dashboard" },
]

# Only for a dashboard in a different Cloudflare account: remove `services`
# above and set its address here.
# [vars]
# DASHBOARD_URL = "https://bot-analytics-dashboard.<your-subdomain>.workers.dev"

[build]
command = "node ../scripts/build-tables.mjs"
watch_dir = ["../src", "../tables"]
